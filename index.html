<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science Dictionary</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.5;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .search-box {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      padding: 0 0.25rem;
    }

    #dictionary {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
    }

    .word {
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--accent);
      text-transform: capitalize;
      margin-bottom: 0.35rem;
    }

    .definition {
      color: #e2e8f0;
      font-size: 0.98rem;
    }

    .load-more {
      display: block;
      width: 100%;
      padding: 0.85rem;
      margin-top: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .load-more:hover {
      background: #253346;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Science Dictionary</h1>
    <p class="subtitle">Search thousands of scientific definitions and terms</p>
  </header>

  <input type="text" id="search" class="search-box" placeholder="Search terms or definitions..." oninput="handleSearch()">

  <div class="meta-info">
    <span id="results-count">Loading dictionary...</span>
  </div>

  <div id="dictionary"></div>
  <button id="load-more-btn" class="load-more hidden" onclick="loadMore()">Load More Results</button>

  <script>
    let dictionaryList = [];
    let filteredList = [];
    let page = 1;
    const PAGE_SIZE = 50;

    async function initDictionary() {
      try {
        const response = await fetch('information.json');
        const rawData = await response.json();

        // Convert key-value JSON object into an array for faster filtering
        dictionaryList = Object.entries(rawData).map(([term, def]) => {
          const definitionText = Array.isArray(def) ? def.join(' ') : String(def);
          return {
            word: term,
            definition: definitionText
          };
        });

        filteredList = dictionaryList;
        renderResults();
      } catch (err) {
        document.getElementById('results-count').innerText = 'Failed to load information.json.';
        console.error('Error fetching dictionary:', err);
      }
    }

    function renderResults() {
      const container = document.getElementById('dictionary');
      const countEl = document.getElementById('results-count');
      const loadMoreBtn = document.getElementById('load-more-btn');

      if (page === 1) {
        container.innerHTML = '';
      }

      const visibleItems = filteredList.slice(0, page * PAGE_SIZE);

      if (filteredList.length === 0) {
        countEl.innerText = 'No matching terms found.';
        loadMoreBtn.classList.add('hidden');
        return;
      }

      countEl.innerText = `Showing ${visibleItems.length} of ${filteredList.length} terms`;

      const fragment = document.createDocumentFragment();
      const currentBatch = filteredList.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

      currentBatch.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="word">${escapeHTML(item.word)}</div>
          <div class="definition">${escapeHTML(item.definition)}</div>
        `;
        fragment.appendChild(card);
      });

      container.appendChild(fragment);

      if (visibleItems.length < filteredList.length) {
        loadMoreBtn.classList.remove('hidden');
      } else {
        loadMoreBtn.classList.add('hidden');
      }
    }

    function handleSearch() {
      const query = document.getElementById('search').value.toLowerCase().trim();
      page = 1;

      if (!query) {
        filteredList = dictionaryList;
      } else {
        filteredList = dictionaryList.filter(item => 
          item.word.toLowerCase().includes(query) || 
          item.definition.toLowerCase().includes(query)
        );
      }

      renderResults();
    }

    function loadMore() {
      page++;
      renderResults();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    initDictionary();
  </script>
</body>
</html>
